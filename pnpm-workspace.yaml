packages:
  - apps/*
  - packages/*
  - workers/*
engineStrict: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # Manually published without provenance; see paulmillr/chokidar#1440
  # Remove when svelte-check no longer requires chokidar@4.0.3
  - chokidar@4.0.3
trustLockfile: false
overrides:
  # Keep Drizzle Kit's legacy loader on the same patched esbuild as Drizzle Kit.
  '@esbuild-kit/core-utils>esbuild': 0.28.2
allowBuilds:
  lefthook: true
  esbuild: true
  workerd: true
  sharp: true
  unrs-resolver: false
