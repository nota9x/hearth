name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:unit

  integration:
    name: Integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit configuration
        run: pnpm --filter @hearth/web exec svelte-kit sync
      # Global setup bundles delivery and the upload fixture with Wrangler.
      - name: Integration tests
        run: pnpm test:integration --shard=${{ matrix.shard }}/2

  browser:
    name: Browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Build web
        run: pnpm build
      # Global setup bundles web, delivery, and maintenance with Wrangler.
      - name: Browser tests
        run: pnpm test:browser --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Upload browser failure reports
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
          # Never publish artifacts/, fixture state, test-key, or SXCU files.

  validate:
    if: ${{ always() }}
    needs: [quality, integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to succeed
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          printf 'Quality: %s\nIntegration: %s\nBrowser: %s\n' "$QUALITY" "$INTEGRATION" "$BROWSER"
          [[ "$QUALITY" == success && "$INTEGRATION" == success && "$BROWSER" == success ]]
